name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "thermal-worker/**"
      - "prisma/**"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            thermal-worker/package-lock.json

      # Install root deps (prisma + dotenv) for the migrate step, and
      # worker deps for lint + test. The Fly remote builder builds the
      # worker image from the Dockerfile, so the runtime image does not
      # reuse these node_modules.
      - run: npm ci

      - run: npm ci --prefix thermal-worker

      - name: Lint
        run: npm run lint --prefix thermal-worker

      - name: Test
        run: npm test --prefix thermal-worker

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config thermal-worker/fly.toml --dockerfile thermal-worker/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
